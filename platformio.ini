;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps = 
	; marvinroger/AsyncMqttClient@^0.8.2
	Homie@^3.0.0
	; me-no-dev/ESP Async WebServer@^1.2.3
	; hellerchr/ESP8266 Websocket Client@^1.0.2
	; ESP8266WiFi
	paulstoffregen/OneWire@^2.3.5
	milesburton/DallasTemperature@^3.9.1
	crankyoldgit/IRremoteESP8266@^2.7.13
	; mbed-aluqard/arduino@0.0.0+sha.3b83fc30bbdf
; lib_extra_dirs = ${PROJECT_DIR}\..\lib
lib_extra_dirs = C:\Program Files (x86)\Arduino\libraries
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
lib_ignore = ESPAsyncTCP, ESPAsyncWebServer
; lib_ignore = AsyncTCP, ESPAsyncTCP, Async WebServer, ESPAsyncWebServer


; Changes required to make the code work with the latest version of Homie (3.0.1) are based on hints 
; from https://github.com/giladger/ElectraWifi/tree/master and are marked in the code with "Changed by WFW on 20.03.2026".
; in .pio\libdeps\nodemcuv2\Homie\src\Homie\Boot\BootConfig.hpp and .pio\libdeps\nodemcuv2\Homie\src\Homie\Boot\BootConfig.cpp.

